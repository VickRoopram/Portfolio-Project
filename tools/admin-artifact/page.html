<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Vick Does Creative · Content admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400..900&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* the site's design tokens, so the admin speaks the same visual language */
{{TOKENS}}
/* ── admin layout ── */
body{overflow:auto;font-size:14px}
button,input,select,textarea{font:inherit;color:inherit}
.app{display:grid;grid-template-columns:232px minmax(300px,380px) minmax(0,1fr);grid-template-rows:auto minmax(0,1fr);height:100vh}
header.bar{grid-column:1/-1;display:flex;align-items:center;gap:var(--s4);padding:var(--s3) var(--s5);border-bottom:1px solid var(--line);background:var(--floor)}
.brand{display:flex;flex-direction:column;gap:2px;margin-right:auto}
.brand b{font:800 var(--t-md)/1.1 var(--display);letter-spacing:-.01em}
.brand small{font-size:var(--t-xs);color:var(--mute)}
.pill{display:inline-flex;align-items:center;gap:6px;padding:5px 10px;border-radius:999px;background:var(--chip);color:var(--chip-ink);font:600 var(--t-xs)/1 var(--body);white-space:nowrap}
.pill i{width:7px;height:7px;border-radius:50%;background:#3f9a5b}
.pill.saving i{background:#d9a12b}.pill.err i{background:var(--red)}
.btn{display:inline-flex;align-items:center;gap:var(--s2);text-decoration:none;min-height:36px;padding:0 var(--s3);border:1px solid var(--line);border-radius:var(--r2);background:var(--card);cursor:pointer;font-weight:600;white-space:nowrap;transition:border-color .15s,background-color .15s,transform .1s}
.btn:hover{border-color:var(--ink)}.btn:active{transform:scale(.97)}
.btn.primary{background:var(--accent-ui);border-color:var(--accent-ui);color:var(--on-accent)}
.btn.primary:hover{box-shadow:0 6px 18px color-mix(in srgb,var(--accent-ui) 35%,transparent)}
.btn.ghost{border-color:transparent;background:none}.btn.ghost:hover{border-color:var(--line)}
.btn.danger{color:var(--red)}.btn.danger:hover{border-color:var(--red)}
.btn:disabled{opacity:.45;cursor:not-allowed;transform:none}
.icon-btn{display:grid;place-items:center;width:32px;height:32px;padding:0;border:1px solid transparent;border-radius:var(--r1);background:none;cursor:pointer}
.icon-btn:hover{border-color:var(--line)}
.ic{display:block;flex:none}
aside,.list,.edit{min-height:0;overflow:auto}
aside{border-right:1px solid var(--line);padding:var(--s4) var(--s3)}
aside h3{margin:var(--s4) var(--s2) var(--s2);font:700 var(--t-xs)/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
aside h3:first-child{margin-top:0}
.nav{display:flex;align-items:center;gap:var(--s2);width:100%;padding:var(--s2);border:0;border-radius:var(--r2);background:none;cursor:pointer;text-align:left}
.nav:hover{background:var(--chip)}
.nav[aria-current="true"]{background:var(--card);box-shadow:inset 0 0 0 1px var(--line)}
.nav .dot{width:10px;height:10px;border-radius:3px;background:var(--c);box-shadow:0 0 8px color-mix(in srgb,var(--c) 70%,transparent);flex:none}
.nav span{flex:1;font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav small{font:600 var(--t-xs)/1 var(--body);color:var(--mute);font-variant-numeric:tabular-nums}
.nav small.over{color:var(--red)}
.sync{margin-top:var(--s5);padding:var(--s3);border:1px solid var(--line);border-radius:var(--r2);background:var(--card);display:grid;gap:var(--s3)}
.sync h4{margin:0;font:700 var(--t-sm)/1.2 var(--body)}
.sync .row{display:grid;gap:2px}
.sync .row b{font-size:var(--t-xs);text-transform:uppercase;letter-spacing:.06em;color:var(--mute)}
.sync .row span{font-size:var(--t-sm)}
.sync .note{font-size:var(--t-xs);color:var(--mute);line-height:1.4;margin:0}
.req{padding:var(--s3);border-radius:var(--r1);background:color-mix(in srgb,var(--accent-ui) 12%,transparent);font-size:var(--t-sm);line-height:1.4}
.req code{font:600 12px var(--body);background:var(--card);padding:2px 6px;border-radius:4px}
.list{border-right:1px solid var(--line);padding:var(--s4)}
.ghead{display:grid;gap:var(--s2);margin-bottom:var(--s4)}
.ghead .part{font:700 var(--t-xs)/1 var(--body);letter-spacing:.08em;text-transform:uppercase;color:var(--mute)}
.ghead input.name{width:100%;padding:var(--s1) 0;border:0;border-bottom:1px solid transparent;background:none;font:800 var(--t-xl)/1.1 var(--display);letter-spacing:-.015em}
.ghead input.name:focus{outline:none;border-color:var(--line)}
.ghead p{margin:0;color:var(--mute);font-size:var(--t-sm);line-height:1.45}
.colours{display:flex;gap:var(--s4);flex-wrap:wrap}
.colours label{display:flex;align-items:center;gap:var(--s2);font-size:var(--t-xs);color:var(--mute);font-weight:600}
.colours input{width:28px;height:28px;padding:0;border:1px solid var(--line);border-radius:6px;background:none;cursor:pointer}
.slots{display:grid;gap:4px;margin:var(--s3) 0 var(--s4)}
.slots.kb{grid-template-columns:repeat(7,1fr)}
.slots.cv{grid-template-columns:repeat(2,1fr)}
.slot{min-height:44px;padding:5px 6px;border:1px solid var(--line);border-radius:6px;background:var(--card2);font-size:10px;line-height:1.2;overflow:hidden;text-align:left;cursor:pointer;color:var(--mute)}
.slot b{display:block;font-weight:700;letter-spacing:.04em;margin-bottom:2px}
.slot span{display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;color:var(--ink)}
.slot.on{border-color:color-mix(in srgb,var(--c) 70%,var(--line));box-shadow:inset 0 -3px 0 var(--c)}
.slot.sel{background:color-mix(in srgb,var(--c) 18%,var(--card2))}
.slot.off{cursor:default;opacity:.55}.slot.off span{color:var(--mute)}
.slabel{display:flex;justify-content:space-between;font-size:var(--t-xs);color:var(--mute);font-weight:600}
ol.items{list-style:none;margin:0 0 var(--s3);padding:0;display:grid;gap:4px}
ol.items li{display:grid;grid-template-columns:auto 26px 44px minmax(0,1fr) auto;align-items:center;gap:var(--s2);padding:6px;border:1px solid transparent;border-radius:var(--r2);cursor:pointer}
ol.items li:hover{background:var(--chip)}
ol.items li[aria-current="true"]{background:var(--card);border-color:var(--line)}
ol.items li.over{opacity:.55}
ol.items li.drop{border-color:var(--accent-ui)}
.grip{cursor:grab;color:var(--mute);font-size:16px;line-height:1;user-select:none}
.num{font:600 var(--t-xs)/1 var(--body);color:var(--mute);font-variant-numeric:tabular-nums;text-align:center}
.th{width:44px;height:32px;border-radius:5px;background:var(--chip) center/cover no-repeat}
.tx{min-width:0}.tx b{display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.tx small{display:block;color:var(--mute);font-size:var(--t-xs);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mv{display:flex;flex-direction:column;opacity:0;transition:opacity .15s}
li:hover .mv,li:focus-within .mv,li[aria-current="true"] .mv{opacity:1}
.mv button{border:0;background:none;padding:0 4px;cursor:pointer;color:var(--mute);line-height:1}
.mv button:hover{color:var(--ink)}
.edit{padding:var(--s4) var(--s5) var(--s7)}
.etop{display:flex;align-items:center;gap:var(--s2);flex-wrap:wrap;margin-bottom:var(--s4)}
.etop .where{margin-right:auto;font:600 var(--t-xs)/1.3 var(--body);color:var(--mute);letter-spacing:.04em;text-transform:uppercase}
.tabs{display:inline-flex;padding:3px;border-radius:var(--r2);background:var(--chip)}
.tabs button{padding:6px 12px;border:0;border-radius:7px;background:none;cursor:pointer;font-weight:600;color:var(--mute)}
.tabs button[aria-selected="true"]{background:var(--card);color:var(--ink);box-shadow:0 1px 3px var(--shadow)}
.form{display:grid;gap:var(--s5);max-width:720px}
.field{display:grid;gap:6px}
.field>span,.flabel{font:700 var(--t-xs)/1 var(--body);letter-spacing:.06em;text-transform:uppercase;color:var(--mute);display:flex;justify-content:space-between;align-items:center}
.field input,.field textarea,.pair input,select{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--r1);background:var(--card)}
.field input:focus,.field textarea:focus,.pair input:focus,.rte:focus{outline:2px solid color-mix(in srgb,var(--accent-ui) 60%,transparent);outline-offset:-1px}
.field small{color:var(--mute);font-size:var(--t-xs);line-height:1.4}
.rte-wrap{border:1px solid var(--line);border-radius:var(--r1);background:var(--card);overflow:hidden}
.rte-bar{display:flex;gap:2px;padding:4px;border-bottom:1px solid var(--line);flex-wrap:wrap}
.rte-bar button{min-width:30px;height:28px;padding:0 8px;border:0;border-radius:5px;background:none;cursor:pointer;font-weight:700;font-size:12px;color:var(--mute)}
.rte-bar button:hover,.rte-bar button[aria-pressed="true"]{background:var(--chip);color:var(--ink)}
.rte-bar .sep{width:1px;background:var(--line);margin:4px}
.rte{min-height:160px;max-height:420px;overflow:auto;padding:12px 14px;line-height:1.6}
.rte:empty::before{content:"Write the story of this project…";color:var(--mute)}
.rte p{margin:0 0 .7em}.rte h3{margin:.8em 0 .4em;font-size:12px;letter-spacing:.06em;text-transform:uppercase;color:var(--mute)}
.rte .steps,.rte .tags{display:flex;flex-wrap:wrap;gap:6px}.rte .steps div,.rte .tags span{padding:6px 8px;border:1px solid var(--line);border-radius:6px;font-size:12px}
textarea.html{min-height:220px;border:0;border-radius:0;font:500 12px/1.5 "IBM Plex Mono",monospace;resize:vertical}
.imgs{display:grid;grid-template-columns:repeat(auto-fill,minmax(180px,1fr));gap:var(--s3)}
.imgc{border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;background:var(--card)}
.imgc .pv{position:relative;aspect-ratio:16/10;background:var(--chip) center/cover no-repeat;display:grid;place-items:center;color:var(--mute);font-size:var(--t-xs);text-align:center;padding:6px}
.imgc .pv b{position:absolute;top:6px;left:6px;padding:3px 6px;border-radius:4px;background:var(--ink);color:var(--floor);font-size:10px}
.imgc .ctl{display:flex;gap:2px;padding:6px}
.imgc input{flex:1;min-width:0;padding:6px 8px;border:1px solid var(--line);border-radius:5px;background:var(--card2);font-size:12px}
.drop{display:grid;place-items:center;gap:6px;min-height:96px;padding:var(--s4);border:1.5px dashed var(--line);border-radius:var(--r2);color:var(--mute);text-align:center;font-size:var(--t-sm);cursor:pointer}
.drop.over{border-color:var(--accent-ui);color:var(--ink);background:color-mix(in srgb,var(--accent-ui) 8%,transparent)}
.pairs{display:grid;gap:6px}
.pair{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1.4fr) auto;gap:6px;align-items:center}
.pair.bar3{grid-template-columns:minmax(0,1.6fr) minmax(0,.8fr) 120px auto}
.pair.soc{grid-template-columns:auto minmax(0,1fr) minmax(0,1.4fr) auto auto}
.pair .ic{color:var(--accent-ui)}
.flags{padding:var(--s3);border-radius:var(--r1);background:var(--chip);color:var(--chip-ink);font-size:var(--t-sm);line-height:1.45}
.actions{display:flex;gap:var(--s2);flex-wrap:wrap;padding-top:var(--s4);border-top:1px solid var(--line)}
.actions .sp{flex:1}
.preview{display:grid;justify-items:center;gap:var(--s3)}
.preview iframe{width:min(430px,100%);height:min(78vh,820px);border:1px solid var(--line);border-radius:var(--r3);background:var(--card);box-shadow:0 24px 60px var(--shadow)}
.preview small{color:var(--mute);font-size:var(--t-xs)}
.empty{display:grid;place-items:center;gap:var(--s3);min-height:50vh;text-align:center;color:var(--mute)}
.banner{grid-column:1/-1;padding:var(--s3) var(--s5);background:color-mix(in srgb,var(--red) 14%,var(--floor));font-size:var(--t-sm)}
.loading{display:grid;place-items:center;gap:var(--s3);height:100vh;color:var(--mute)}
.spin{width:22px;height:22px;border-radius:50%;border:2px solid currentColor;border-right-color:transparent;animation:spin .8s linear infinite}
dialog{border:1px solid var(--line);border-radius:var(--r3);background:var(--card);color:var(--ink);padding:var(--s5);max-width:420px;box-shadow:0 24px 60px var(--shadow)}
dialog::backdrop{background:rgba(20,16,12,.45)}
dialog h3{margin:0 0 var(--s2);font:800 var(--t-lg)/1.2 var(--display)}
dialog p{margin:0 0 var(--s4);color:var(--mute);line-height:1.5}
dialog .act{display:flex;justify-content:flex-end;gap:var(--s2)}
#toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);z-index:50;padding:10px 16px;border-radius:var(--r2);background:var(--ink);color:var(--floor);font-weight:600;box-shadow:0 12px 30px var(--shadow)}
#toast.show{animation:toastIn .3s var(--ease)}
@keyframes toastIn{from{opacity:0;transform:translate(-50%,8px)}}
@media (max-width:1100px){.app{grid-template-columns:200px minmax(0,1fr);grid-template-rows:auto auto minmax(0,1fr)}.list{grid-column:2;border-right:0;border-bottom:1px solid var(--line);max-height:46vh}.edit{grid-column:2}}
@media (max-width:720px){.app{display:block;height:auto}aside,.list{border:0;border-bottom:1px solid var(--line);max-height:none}.slots.kb{grid-template-columns:repeat(4,1fr)}.pair,.pair.bar3,.pair.soc{grid-template-columns:1fr 1fr auto}header.bar{flex-wrap:wrap}}
</style>
</head>
<body>
<div id="root"><div class="loading"><div class="spin"></div><span id="loadMsg">Loading your content…</span></div></div>
<div id="toast" hidden></div>
<dialog id="dlg"><h3 id="dlgT"></h3><p id="dlgP"></p><div class="act"><button class="btn" value="no" id="dlgNo">Cancel</button><button class="btn primary" id="dlgYes">OK</button></div></dialog>
<script>
/* ═══════════ Vick Does Creative · content admin (Claude artifact) ═══════════
   Content lives in this artifact's database:
     groups/<key>   one synth section {name, col, glow?, items[]}   (gd ux mo tl xp ab cv)
     site/socials   {links: [[label, url], …]}                     (contact card + remote)
     site/sync      sync requests and history, written by this page and by Claude
   Claude sends it to the site: "sync" → the version-01 preview, "publish" → the live site. */
const PATHS = {{PATHS}};
const SITE_CSS = {{SITECSS}};
const $ = id => document.getElementById(id);
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const clone = o => JSON.parse(JSON.stringify(o));
const icon = (n, s = 18) => `<svg class="ic" viewBox="0 0 24 24" width="${s}" height="${s}" fill="none" aria-hidden="true"><path d="${PATHS[n] || PATHS.globe}" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
const socialIcon = (label, s) => icon(String(label).toLowerCase().split(/[ (·]/)[0], s);

/* how each group sits on the synth */
const ORDER = ['gd', 'ux', 'mo', 'tl', 'xp', 'ab', 'cv'];
const META = {
  gd: { part: 'Mode button · DESIGN', glow: '#22ff7a', slots: 'kb', how: 'Pressing DESIGN loads these onto the 14 keys, left to right.' },
  ux: { part: 'Mode button · UI/UX', glow: '#3fb2ff', slots: 'kb', how: 'Pressing UI/UX loads these onto the 14 keys, left to right.' },
  mo: { part: 'Mode button · MOTION', glow: '#ff6a20', slots: 'kb', how: 'Pressing MOTION loads these onto the 14 keys, left to right.' },
  tl: { part: 'Mode button · TOOLS', glow: '#a46bff', slots: 'kb', how: 'Pressing TOOLS loads these onto the 14 keys, left to right.' },
  xp: { part: 'Mode button · EXPERIMENTAL', glow: '#ff5ec8', slots: 'kb', how: 'Pressing EXPERIMENTAL loads these onto the 14 keys, left to right.' },
  ab: { part: 'About · screen, menu and key 6', glow: '#ff2a30', slots: 'kb', how: 'Clicking the synth screen or About in the menu opens the first of these; they also load onto the keys.' },
  cv: { part: 'The remote', glow: '#ff6a20', slots: 'cv', how: 'The remote on the left. Its buttons open these; the first is reached with the card arrows.' },
};
const LIMIT = { kb: 14, cv: 6 };
const CV_SLOTS = ['Card arrows', 'CONTACT', 'Behance key', 'Instagram key', 'LinkedIn key', '··· key'];
const PREVIEW = 'https://version-01--vick-does-creative.netlify.app/', LIVE = 'https://vick-does-creative.netlify.app/';

/* image sources: site images ship with this artifact; uploads live in its assets until a sync moves them to the site */
const imgURL = s => !s ? '' : /^\/?assets\/img\//.test(s) ? 'img/' + s.split('/').pop() : s.startsWith('asset:') ? '/_blob/' + s.slice(6) : '';
const imgNote = s => s.startsWith('/media/') ? 'Uploaded on the site' : /^https?:/.test(s) ? 'Web image' : s;

/* the canonical form of the content: Claude sends exactly this, and its hash tells you what's unsent */
const FIELDS = ['t', 'k', 'd', 'img', 'tags', 'links', 'bars', 'hero', 'contact', 'life'];
function canon() {
  const ch = {};
  for (const k of ORDER) { const g = S.groups[k]; if (!g) continue;
    ch[k] = { name: g.name || '', col: g.col || '#d71920', ...(g.glow ? { glow: g.glow } : {}), items: (g.items || []).map(it => { const o = {}; for (const f of FIELDS) if (it[f] !== undefined && it[f] !== '' && !(Array.isArray(it[f]) && !it[f].length)) o[f] = f === 'img' ? it.img.map(m => ({ s: m.s, a: m.a ?? '' })) : it[f]; return o }) } }
  return { ch, links: (S.socials || []).filter(l => l[0] && l[1]) };
}
function hash(str) { let h = 0x811c9dc5; for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 0x01000193) } return (h >>> 0).toString(16).padStart(8, '0') }
const contentHash = () => hash(JSON.stringify(canon()));
/* one fingerprint per section, so a sync can say exactly which sections changed */
const groupHashes = () => { const c = canon(), o = { links: hash(JSON.stringify(c.links)) }; for (const k in c.ch) o[k] = hash(JSON.stringify(c.ch[k])); return o };

/* keep only harmless formatting in descriptions before they touch the page */
const OK_TAGS = new Set(['P', 'BR', 'B', 'STRONG', 'I', 'EM', 'U', 'A', 'UL', 'OL', 'LI', 'H3', 'H4', 'DIV', 'SPAN', 'SMALL', 'BLOCKQUOTE', 'HR']);
function clean(html) {
  const t = document.createElement('template'); t.innerHTML = String(html || '');
  const walk = n => [...n.childNodes].forEach(c => {
    if (c.nodeType === 8) return c.remove(); if (c.nodeType !== 1) return;
    if (!OK_TAGS.has(c.tagName)) { if (/^(SCRIPT|STYLE|IFRAME|OBJECT|EMBED|SVG|MATH|TEMPLATE|FORM|INPUT|BUTTON|TEXTAREA|SELECT|LINK|META|BASE|IMG|VIDEO|AUDIO)$/.test(c.tagName)) return c.remove(); walk(c); c.replaceWith(...c.childNodes); return }
    [...c.attributes].forEach(a => { const n = a.name.toLowerCase(), v = a.value;
      const keep = (n === 'class' && /^[\w\s-]*$/.test(v)) || (n === 'style' && !/url\s*\(|expression|javascript:|@import|behavior/i.test(v)) || (c.tagName === 'A' && n === 'href' && /^(https?:|mailto:|tel:|\/|#|assets\/)/i.test(v.trim()));
      if (!keep) c.removeAttribute(a.name) });
    if (c.tagName === 'A') { c.setAttribute('target', '_blank'); c.setAttribute('rel', 'noopener') }
    walk(c) });
  walk(t.content); return t.innerHTML.trim();
}

/* ── state ── */
const S = { groups: {}, socials: null, sync: {}, cur: 'gd', sel: 0, tab: 'edit', html: false, ready: false, canWrite: true };
let db = null, assets = null;
const pending = {}, timers = {}, writing = {};
let saveState = 'saved';

function toast(msg) { const t = $('toast'); t.textContent = msg; t.hidden = false; t.classList.remove('show'); void t.offsetWidth; t.classList.add('show'); clearTimeout(toast.h); toast.h = setTimeout(() => t.hidden = true, 2800) }
function ask(title, body, yes = 'OK', danger = false) {
  return new Promise(res => { const d = $('dlg'); $('dlgT').textContent = title; $('dlgP').innerHTML = body; $('dlgYes').textContent = yes; $('dlgYes').className = 'btn ' + (danger ? 'danger' : 'primary');
    $('dlgYes').onclick = () => { d.close(); res(true) }; $('dlgNo').onclick = () => { d.close(); res(false) }; d.oncancel = () => res(false); d.showModal() });
}
const ago = iso => { if (!iso) return 'never'; const s = (Date.now() - Date.parse(iso)) / 1000; if (s < 60) return 'just now'; if (s < 3600) return Math.round(s / 60) + ' min ago'; if (s < 86400) return Math.round(s / 3600) + ' h ago'; return new Date(iso).toLocaleDateString(undefined, { day: 'numeric', month: 'short', hour: '2-digit', minute: '2-digit' }) };

/* ── saving: one write at a time per document, coalesced into a write per pause ── */
function setSave(st) { saveState = st; const p = $('savePill'); if (!p) return; p.className = 'pill ' + (st === 'saved' ? '' : st === 'error' ? 'err' : 'saving'); p.lastChild.textContent = st === 'saved' ? 'All changes saved' : st === 'error' ? 'Couldn’t save · retrying' : 'Saving…'; renderSync() }
function touch(key = S.cur) { pending[key] = true; setSave('saving'); clearTimeout(timers[key]); timers[key] = setTimeout(() => flush(key), 650); renderNav() }
async function flush(key) {
  if (writing[key]) { timers[key] = setTimeout(() => flush(key), 300); return }
  writing[key] = true; pending[key] = false;
  const path = key === 'socials' ? 'site/socials' : 'groups/' + key, body = key === 'socials' ? { links: S.socials } : clone(S.groups[key]);
