<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vickhal Roopram: UX/UI, graphic and motion designer. A portfolio you play as a 3D synthesizer.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#f6f6f4">
<title>Vick Does Creative</title>
<script>
/* Pick the theme before the first paint: saved choice, else the system setting */
(function(){var t;try{t=localStorage.getItem('vdc-theme')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';document.documentElement.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Montserrat:wght@400..900&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="src/styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"><div id="loading">POWERING ON…</div></div>
<header class="top" id="top">
  <a class="brand" id="brand" href="./" aria-label="Vickhal Roopram: back to the full synth"><img class="on-d" src="assets/ui/logo-on-dark.svg" width="290" height="101" alt=""><img class="on-l" src="assets/ui/logo-on-light.svg" width="290" height="101" alt=""></a>
  <div class="hud">
    <div class="pair">
    <button class="ico" id="thm" aria-pressed="false" aria-label="Switch to dark mode"><img class="i-sun on-d" src="assets/ui/sun-on-dark.svg" width="24" height="24" alt=""><img class="i-moon on-l" src="assets/ui/moon-on-light.svg" width="24" height="24" alt=""></button>
    <button class="ico" id="snd" aria-pressed="true" aria-label="Sound on: mute"><img class="s-on on-d" src="assets/ui/sound-on-on-dark.svg" width="24" height="24" alt=""><img class="s-on on-l" src="assets/ui/sound-on-on-light.svg" width="24" height="24" alt=""><img class="s-off on-d" src="assets/ui/sound-off-on-dark.svg" width="24" height="24" alt=""><img class="s-off on-l" src="assets/ui/sound-off-on-light.svg" width="24" height="24" alt=""></button>
    </div>
    <button class="ico burger" id="mnu" aria-expanded="false" aria-controls="menu" aria-label="Menu"><i></i><i></i><i></i></button>
  </div>
</header>
<nav id="menu" hidden aria-label="Sections">
  <button id="home" data-go="home"><b>Home</b><small>The full synth</small></button>
  <button data-go="about" style="--gc:#00ff15"><b>About Me</b><small>The life strip</small></button>
  <button data-go="projects" style="--gc:#00bfff"><b>My Projects</b><small>The keyboard</small></button>
  <button data-go="contact" style="--gc:#ff2020"><b>Contact</b><small>CV, contact &amp; socials</small></button>
  <button data-go="desk" style="--gc:#3fb2ff"><b>Desktop</b><small>Projects on the screen</small></button>
  <a href="assets/cv/vickhal-roopram-cv.pdf" target="_blank" rel="noopener"><b>Download CV</b><small>PDF</small></a>
</nav>
<div id="groups">
  <button class="grp" data-g="about" data-a="l" style="--gc:#00ff15">About Me</button>
  <button class="grp" data-g="contact" data-a="c" style="--gc:#ff2020">Contact</button>
  <button class="grp" data-g="projects" data-a="r" style="--gc:#00bfff">My Projects</button>
</div>
<div class="nav" id="nav" role="group" aria-label="Camera controls">
  <div class="joy" id="joy" tabindex="0" role="button" aria-label="Camera tilt. Drag, or hold the arrow keys, to orbit the synth. Tap or press Enter to reset the view." title="Drag to tilt · tap to reset">
    <svg class="joy-face" viewBox="0 0 100 100" aria-hidden="true">
      <circle cx="50" cy="50" r="46" class="rim"/><circle cx="50" cy="50" r="33" class="well"/>
      <path d="M50 9 46 15h8zM50 91l-4-6h8zM9 50l6-4v8zM91 50l-6-4v8z" class="chev"/>
    </svg>
    <span class="joy-knob" id="joyKnob" aria-hidden="true"><i></i></span>
    <span class="cap" aria-hidden="true">Rotate &amp; Tilt</span>
  </div>
  <div class="zoom" id="zoom" tabindex="0" role="slider" aria-label="Zoom" aria-orientation="vertical" aria-valuemin="0" aria-valuemax="100" aria-valuenow="50" title="Zoom">
    <span class="z-sign" aria-hidden="true">+</span>
    <span class="z-track" aria-hidden="true"><span class="z-fill"></span><span class="z-ticks"></span><span class="z-thumb"></span></span>
    <span class="z-sign" aria-hidden="true">−</span>
    <span class="cap" aria-hidden="true">Zoom</span>
  </div>
</div>
<div id="lbl" hidden></div>
<div id="card" hidden role="dialog" aria-label="Details">
  <div class="ch"><div class="eyebrow" id="eb"></div><button id="prev" aria-label="Previous">‹</button><button id="next" aria-label="Next">›</button><button id="cls" aria-label="Close">✕</button></div>
  <div class="content" id="ct"></div>
</div>
<div id="lb" hidden><img alt=""></div>
<script type="module" src="src/main.js"></script>
</body>
</html>
