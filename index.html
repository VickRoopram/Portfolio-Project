<script>
/* skip the intro on a return visit in the same session (set before the first paint) */
(function(){try{if(sessionStorage.getItem('vdc-in'))document.documentElement.classList.add('entered')}catch(e){}})();
/* boil: the hand-drawn filter (#boil, below) gets a new seed six times a second, so ink lines and lettering shiver like redrawn frames */
addEventListener('DOMContentLoaded',function(){var t=document.querySelector('#boil feTurbulence'),n=0;
  if(t&&!matchMedia('(prefers-reduced-motion: reduce)').matches)setInterval(function(){if(!document.hidden)t.setAttribute('seed',1+(n=(n+1)%4))},166)});
</script>

<!-- hand-drawn line: this filter nudges whatever it's on; its seed is stepped a few times a second so the lines "boil" (organisms/craftui.js) -->
<svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
  <filter id="boil" x="-4%" y="-8%" width="108%" height="116%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".03" numOctaves="2" seed="1" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="3.2" xChannelSelector="R" yChannelSelector="G"/></filter>
  <filter id="torn" x="-3%" y="-3%" width="106%" height="106%" color-interpolation-filters="sRGB"><feTurbulence type="fractalNoise" baseFrequency=".045" numOctaves="3" seed="8" result="n"/><feDisplacementMap in="SourceGraphic" in2="n" scale="5" xChannelSelector="R" yChannelSelector="G"/></filter>
</defs></svg>
