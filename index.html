<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vickhal Roopram: UX/UI, graphic and motion designer. A portfolio you play as a 3D synthesizer.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#ece5d8">
<title>Vick Does Creative</title>
<script>
/* Pick the theme before the first paint: saved choice, else the system setting */
(function(){var t,d=document.documentElement;try{t=localStorage.getItem('vdc-theme');if(sessionStorage.getItem('vdc-in'))d.classList.add('entered')}catch(e){}if(!t)t=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light';d.dataset.theme=t})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Montserrat:wght@400..900&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="src/styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"><div id="loading">POWERING ON…</div></div>
<header class="top" id="top">
  <a class="brand" id="brand" href="./" aria-label="Vickhal Roopram: back to the full synth"><img class="on-d" src="assets/ui/logo-on-dark.svg" width="290" height="101" alt=""><img class="on-l" src="assets/ui/logo-on-light.svg" width="290" height="101" alt=""></a>
  <div class="hud">
    <div class="pair">
    <button class="ico" id="thm" aria-pressed="false" aria-label="Switch to dark mode"><img class="i-sun on-d" src="assets/ui/sun-on-dark.svg" width="24" height="24" alt=""><img class="i-moon on-l" src="assets/ui/moon-on-light.svg" width="24" height="24" alt=""></button>
    <button class="ico" id="snd" aria-pressed="true" aria-label="Sound on: mute"><img class="s-on on-d" src="assets/ui/sound-on-on-dark.svg" width="24" height="24" alt=""><img class="s-on on-l" src="assets/ui/sound-on-on-light.svg" width="24" height="24" alt=""><img class="s-off on-d" src="assets/ui/sound-off-on-dark.svg" width="24" height="24" alt=""><img class="s-off on-l" src="assets/ui/sound-off-on-light.svg" width="24" height="24" alt=""></button>
    </div>
    <button class="ico burger" id="mnu" aria-expanded="false" aria-controls="menu" aria-label="Menu"><i></i><i></i><i></i></button>
  </div>
</header>
<nav id="menu" hidden aria-label="Sections">
  <div class="m-list">
    <button id="home" data-go="home"><b>Home</b></button>
    <button data-go="about"><b>About</b></button>
    <button data-go="projects"><b>Projects</b></button>
    <button data-go="contact"><b>Contact</b></button>
    <a href="assets/cv/vickhal-roopram-cv.pdf" target="_blank" rel="noopener"><b>Download CV</b></a>
  </div>
</nav>
<div id="toast" role="status" hidden></div>
<p id="legend"><span class="d-only">Drag to rotate · Right-drag to pan · Scroll to zoom</span><span class="m-only">Drag to rotate · Pinch to zoom</span></p>
<div id="lbl" hidden></div>
<div id="card" hidden role="dialog" aria-label="Details">
  <div class="ch"><button id="prev" aria-label="Previous project"></button><button id="next" aria-label="Next project"></button><button id="cls" aria-label="Close"></button></div>
  <div class="content" id="ct"></div>
</div>
<div id="lb" hidden><img alt=""></div>
<div id="intro" role="dialog" aria-labelledby="in-h">
  <div class="in-card">
    <h1 id="in-h">Vickhal Roopram</h1>
    <p class="in-sub">UX &amp; motion designer. Explore my work by playing a 3D synth.</p>
    <button class="cta in-go" id="enter" disabled><i class="spin" aria-hidden="true"></i><span>Loading the synth…</span></button>
    <button class="in-quiet" id="quiet">Enter without sound</button>
  </div>
</div>
<script type="module" src="src/main.js"></script>
</body>
</html>
