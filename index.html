<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="description" content="Vickhal Roopram: UX/UI, graphic and motion designer. A portfolio you play as a 3D synthesizer.">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#14171c">
<title>Vick Does Creative</title>
<script>
/* skip the intro on a return visit in the same session (set before the first paint) */
(function(){try{if(sessionStorage.getItem('vdc-in'))document.documentElement.classList.add('entered')}catch(e){}})();
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bungee&family=Montserrat:wght@400..900&family=Courier+Prime:wght@400;700&family=IBM+Plex+Mono:wght@500;600&family=Noto+Sans:wght@400;600;700&display=swap">
<link rel="stylesheet" href="src/styles.css">
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"}}</script>
</head>
<body>
<div id="stage"><div id="loading">POWERING ON…</div></div>
<header class="top" id="top">
  <a class="brand" id="brand" href="./" aria-label="Vickhal Roopram: back to the full synth"><img src="assets/ui/logo-on-dark.svg" width="290" height="101" alt=""></a>
  <div class="hud">
    <button class="cta sm hdr-cta" id="ctaContact" aria-label="Contact: fly to the Contact synth"><i data-icon="mail" data-size="18"></i><span>Contact</span></button>
    <div class="pair">
    <button class="ico" id="snd" aria-pressed="true" aria-label="Sound on: mute"><i class="s-on" data-icon="volume-high"></i><i class="s-off" data-icon="volume-off"></i></button>
    </div>
    <button class="ico burger" id="mnu" aria-expanded="false" aria-controls="menu" aria-label="Menu"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" aria-hidden="true"><path d="M5 7H19"/><path d="M5 12H19"/><path d="M5 17H19"/></svg></button>
  </div>
</header>
<nav id="menu" hidden aria-label="Sections">
  <header class="m-head" id="m-head" hidden><button class="cta ghost sm m-back" id="m-back"><i data-icon="chevron-left" data-size="18"></i><span>Menu</span></button></header>
  <div class="m-body" id="m-body"></div>
</nav>
<div id="toast" role="status" hidden></div>
<p id="legend"><span class="d-only">Drag to rotate · Right-drag to pan</span><span class="m-only">Drag to rotate</span></p>
<div id="joy" role="group" aria-label="Move the view">
  <div class="j-dial" id="jdial" aria-hidden="true"><i class="j-north"></i></div>
  <button class="j-rot l" data-spin="-1" aria-label="Rotate left (hold to keep turning)"><i data-icon="rotate-left" data-size="16"></i></button>
  <button class="j-rot r" data-spin="1" aria-label="Rotate right (hold to keep turning)"><i data-icon="rotate-right" data-size="16"></i></button>
  <button class="j-stick" id="jstick" aria-label="Joystick: drag to pan, tap to recentre. Arrow keys pan, Enter recentres"><i class="j-dot"></i></button>
</div>
<div id="zoom" data-state="idle">
  <button class="z-ico" id="zico" aria-label="How to zoom"><svg class="ic" viewBox="0 0 24 24" width="24" height="24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 21C8.68629 21 6 18.3137 6 15V9C6 5.68629 8.68629 3 12 3C15.3137 3 18 5.68629 18 9V15C18 18.3137 15.3137 21 12 21Z"/><path class="wheel" d="M12 7V10"/></svg></button>
  <div class="z-body">
    <p class="z-tip"><span class="d-only"><b>Scroll</b> to zoom</span><span class="m-only"><b>Pinch</b> to zoom</span></p>
    <div class="z-bar"><span class="z-track" id="zr" role="meter" aria-label="Zoom" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" aria-valuetext="0%"><i class="z-fill"></i></span><output class="z-pct" id="zpct" aria-hidden="true">0%</output></div>
  </div>
</div>
<div id="lbl" hidden></div>
<div id="card" hidden role="dialog" aria-label="Details">
  <div class="ch"><button id="prev" aria-label="Previous project"></button><button id="next" aria-label="Next project"></button><button id="cls" aria-label="Close"></button></div>
  <div class="content" id="ct"></div>
  <div class="cf" id="cf" hidden><button class="cta ghost sm" id="tomenu"><i data-icon="chevron-left" data-size="18"></i><span>Back to menu</span></button><button class="cta ghost sm" id="cancel"><i data-icon="close" data-size="18"></i><span>Cancel</span></button></div>
</div>
<div id="lb" hidden><img alt=""><button class="ico lb-x" aria-label="Close image"><i data-icon="close"></i></button></div>
<div id="intro" role="dialog" aria-labelledby="in-h">
  <div class="in-card">
    <h1 id="in-h">Vickhal Roopram</h1>
    <p class="in-sub">UX &amp; motion designer. Explore my work by playing a 3D synth.</p>
    <button class="cta in-go" id="enter" disabled><i class="spin" aria-hidden="true"></i><span>Loading the synth…</span><i class="go" data-icon="arrow-right" data-size="20"></i></button>
    <button class="in-quiet" id="quiet"><i data-icon="volume-off" data-size="18"></i><span>Enter without sound</span></button>
  </div>
</div>
<script type="module" src="src/atoms/icons.js"></script>
<script type="module" src="src/main.js"></script>
</body>
</html>
